version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '03:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci